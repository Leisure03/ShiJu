name: Deploy ShiJu PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - run_on_apple_17
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web PWA for iPhone / Mobile
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --no-web-resources-cdn

      - name: Add .nojekyll and 404.html SPA fallback
        run: |
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
